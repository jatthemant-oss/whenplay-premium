name: Unpack and build

on:
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'skip-unpack') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Unzip into the repo root
        run: |
          unzip -o *.zip -d _src
          if [ -d _src/whenplay-premium ]; then cp -r _src/whenplay-premium/. .; else cp -r _src/. .; fi
          rm -rf _src
          rm -f *.zip
      - name: Save the source in the repo
        run: |
          git config user.name "WhenPlay Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add WhenPlay Premium source (skip-unpack)" || echo "nothing to commit"
          git push
      - name: Restore signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/tunex.keystore; fi
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/WhenPlay-Premium.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: WhenPlay-Premium-APK
          path: out/*.apk
          retention-days: 90
